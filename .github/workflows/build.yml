name: build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FinFlow.sln

      - name: Build
        run: dotnet build FinFlow.sln -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/FinFlow.Tests/FinFlow.Tests.csproj -c Release
