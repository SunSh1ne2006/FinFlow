name: smoke

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check LocalDB
        shell: pwsh
        run: sqllocaldb info

      - name: Restore
        run: dotnet restore FinFlow.sln

      - name: Build
        run: dotnet build FinFlow.sln -c Release --no-restore

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -StartApi -Configuration Release
